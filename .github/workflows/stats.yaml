name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Stats e linguagens gerados aqui mesmo, pela API do GitHub (sem serviço externo)
      - name: Generate stats and top languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cards.py daniellealpimenta

      # --fail: se o serviço cair, o curl falha e o arquivo antigo continua no lugar,
      # em vez de virar um .svg com a mensagem de erro dentro
      - name: Generate streak
        continue-on-error: true
        run: |
          curl -fsSL "https://streak-stats.demolab.com?user=daniellealpimenta&theme=dark&hide_border=true&locale=pt_BR" -o /tmp/streak.svg
          grep -q "<svg" /tmp/streak.svg && mv /tmp/streak.svg profile/streak.svg

      - name: Generate Pacman Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: daniellealpimenta

      - name: Move Pacman to Profile
        run: |
          mv dist/pacman-contribution-graph.svg profile/pacman.svg
          [ -f dist/pacman-contribution-graph-dark.svg ] && mv dist/pacman-contribution-graph-dark.svg profile/pacman-dark.svg || echo "Dark version not found"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards and Pacman" || exit 0
          git push
